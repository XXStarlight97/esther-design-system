<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七套配色 × 教程页 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'PingFang SC', sans-serif;
    background: #f0ede5;
    padding: 3rem 2rem;
    color: #1A1A2E;
  }
  h1 { text-align: center; font-size: 2rem; margin-bottom: 0.5rem; }
  .sub { text-align: center; color: #666; margin-bottom: 2.5rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 1.5rem;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    transition: transform .15s, box-shadow .15s;
    display: block;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(0,0,0,.1); }
  .card .swatches { display: flex; gap: 8px; margin-bottom: 1rem; }
  .card .swatches span {
    width: 32px; height: 32px; border-radius: 50%;
    display: block; border: 2px solid rgba(0,0,0,.06);
  }
  .card h3 { font-size: 1.05rem; margin-bottom: 0.3rem; }
  .card p { font-size: 0.82rem; color: #888; }
</style>
</head>
<body>
<h1>七套配色 × 教程页 Demo</h1>
<p class="sub">基于 cola-ob-sharing 分享会页面，每套配色一个独立页面</p>
<div class="grid">
